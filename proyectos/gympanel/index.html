<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymPanel Pro — Panel de Administración</title>
  <meta name="description" content="Panel de administración premium para gimnasios. Gestión de clientes, pagos y membresías." />

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --primary-lighter: #eef2ff;
      --primary-subtle: #f5f3ff;
      --accent: #0ea5e9;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.03);
      --shadow: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--gray-100); }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* Card base */
    .card {
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    /* Subtle background pattern */
    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(79, 70, 229, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.03) 0%, transparent 50%);
    }

    /* Animations */
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideRight {
      0% { opacity: 0; transform: translateX(-16px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes countUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .animate-slide-up {
      animation: slideUp 0.5s ease-out forwards;
      opacity: 0;
    }
    .animate-slide-right {
      animation: slideRight 0.4s ease-out forwards;
      opacity: 0;
    }
    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
      opacity: 0;
    }

    /* Table row hover */
    .table-row-hover {
      transition: background-color 0.2s ease;
    }
    .table-row-hover:hover {
      background-color: var(--primary-subtle) !important;
    }

    /* Button press effect */
    .btn-press {
      transition: all 0.2s ease;
    }
    .btn-press:active {
      transform: scale(0.97);
    }
    .btn-press:hover {
      transform: translateY(-1px);
    }

    /* Input focus */
    .input-focus:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    /* Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
    }

    /* Badge pill */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* Metric icon box */
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Plan selector button */
    .plan-btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      text-align: center;
      border: 2px solid transparent;
    }
    .plan-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .plan-btn.inactive {
      background: var(--gray-50);
      color: var(--gray-600);
      border-color: var(--gray-200);
    }
    .plan-btn.inactive:hover {
      border-color: var(--primary-light);
      background: var(--primary-lighter);
      color: var(--primary);
    }

    /* Checkbox styled */
    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--gray-300);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .check-box.checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Discount row */
    .discount-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      width: 100%;
      background: none;
      text-align: left;
      font-size: 14px;
      color: var(--gray-700);
    }
    .discount-row:hover {
      background: var(--gray-50);
    }
    .discount-row.active {
      background: var(--primary-lighter);
      border-color: rgba(79, 70, 229, 0.2);
    }

    /* Method button */
    .method-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .method-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .method-btn.inactive {
      background: var(--gray-50);
      color: var(--gray-600);
      border-color: var(--gray-200);
    }
    .method-btn.inactive:hover {
      border-color: var(--primary-light);
      background: var(--primary-lighter);
    }

    /* Pagination button */
    .page-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }
    .page-btn.active {
      background: var(--primary);
      color: white;
    }
    .page-btn.inactive {
      background: var(--gray-100);
      color: var(--gray-500);
    }
    .page-btn.inactive:hover {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    /* Renew button */
    .renew-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
    }
    .renew-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
      transform: translateY(-1px);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .hide-sm { display: none; }
    }
    @media (min-width: 641px) {
      .show-sm { display: flex; }
    }
    @media (min-width: 1280px) {
      .xl-sidebar { width: 380px; flex-shrink: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ──────────────────────────────────────────────
    // ICONS (inline SVG components)
    // ──────────────────────────────────────────────
    const IconDollar = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:24,height:24}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconUsers = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:24,height:24}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
    );

    const IconClock = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:24,height:24}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconSearch = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const IconPlus = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    );

    const IconDumbbell = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:28,height:28}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 7h2v10H3V7zm16 0h2v10h-2V7zm-4-2h2v14h-2V5zM7 5h2v14H7V5zm4 3h2v8h-2V8z" />
      </svg>
    );

    const IconCash = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
    );

    const IconTransfer = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    );

    const IconBell = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
    );

    const IconCheck = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:14,height:14}} fill="none" viewBox="0 0 24 24" stroke="white" strokeWidth={3}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    );

    const IconPhone = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:14,height:14,color:'#9ca3af'}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
      </svg>
    );

    const IconArrowUp = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:14,height:14}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
      </svg>
    );

    const IconReceipt = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" />
      </svg>
    );

    const IconCalendar = () => (
      <svg xmlns="http://www.w3.org/2000/svg" style={{width:16,height:16}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );

    // ──────────────────────────────────────────────
    // METRIC CARD COMPONENT
    // ──────────────────────────────────────────────
    function MetricCard({ icon, title, value, subtitle, trend, delay, iconBg, iconColor }) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const t = setTimeout(() => setVisible(true), delay);
        return () => clearTimeout(t);
      }, [delay]);

      return (
        <div
          className="card"
          style={{
            padding: '24px',
            cursor: 'default',
            opacity: visible ? 1 : 0,
            transform: visible ? 'translateY(0)' : 'translateY(16px)',
            transition: 'opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease',
          }}
        >
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '16px' }}>
            <div className="icon-box" style={{ background: iconBg || 'var(--primary-lighter)', color: iconColor || 'var(--primary)' }}>
              {icon}
            </div>
            {trend && (
              <div className="badge" style={{ background: 'var(--success-light)', color: 'var(--success)' }}>
                <IconArrowUp />
                {trend}
              </div>
            )}
          </div>
          <p style={{ fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--gray-400)', marginBottom: '4px' }}>{title}</p>
          <p style={{ fontSize: '28px', fontWeight: 800, color: 'var(--gray-900)', marginBottom: '4px', letterSpacing: '-0.02em' }}>{value}</p>
          {subtitle && <p style={{ fontSize: '12px', color: 'var(--gray-400)' }}>{subtitle}</p>}
        </div>
      );
    }

    // ──────────────────────────────────────────────
    // STATUS BADGE
    // ──────────────────────────────────────────────
    function StatusBadge({ status }) {
      const config = {
        'Al día': {
          bg: 'var(--success-light)',
          color: '#059669',
          dotColor: '#10b981',
        },
        'Por vencer': {
          bg: 'var(--warning-light)',
          color: '#d97706',
          dotColor: '#f59e0b',
        },
        'Vencido': {
          bg: 'var(--danger-light)',
          color: '#dc2626',
          dotColor: '#ef4444',
        },
      };
      const c = config[status] || config['Al día'];
      return (
        <span className="badge" style={{ background: c.bg, color: c.color }}>
          <span style={{
            width: '8px',
            height: '8px',
            borderRadius: '50%',
            background: c.dotColor,
            animation: status === 'Vencido' ? 'pulse 2s infinite' : 'none',
          }}></span>
          {status}
        </span>
      );
    }

    // ──────────────────────────────────────────────
    // PAYMENT FORM COMPONENT
    // ──────────────────────────────────────────────
    function PaymentForm() {
      const [plan, setPlan] = useState('mes');
      const [discounts, setDiscounts] = useState({ student: false, senior: false });
      const [payMethod, setPayMethod] = useState('efectivo');
      const [showConfirm, setShowConfirm] = useState(false);

      const basePrice = plan === 'quincena' ? 400 : 700;
      let discount = 0;
      if (discounts.student) discount += 0.15;
      if (discounts.senior) discount += 0.20;
      const finalPrice = basePrice * (1 - discount);

      const toggleDiscount = (key) => {
        setDiscounts(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const handleConfirm = () => {
        setShowConfirm(true);
        setTimeout(() => setShowConfirm(false), 2500);
      };

      return (
        <div className="card animate-slide-right" style={{ padding: '28px', animationDelay: '0.3s' }}>
          {/* Header */}
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '24px' }}>
            <div className="icon-box" style={{ background: 'var(--primary-lighter)', color: 'var(--primary)' }}>
              <IconReceipt />
            </div>
            <div>
              <h3 style={{ fontSize: '16px', fontWeight: 700, color: 'var(--gray-900)' }}>Cobro Rápido</h3>
              <p style={{ fontSize: '12px', color: 'var(--gray-400)' }}>Registrar nuevo pago</p>
            </div>
          </div>

          {/* Client preview */}
          <div style={{ marginBottom: '20px', padding: '14px', borderRadius: '12px', background: 'var(--gray-50)', border: '1px solid var(--gray-200)' }}>
            <p style={{ fontSize: '12px', color: 'var(--gray-400)', marginBottom: '4px' }}>Cliente seleccionado</p>
            <p style={{ fontSize: '14px', fontWeight: 600, color: 'var(--gray-900)' }}>Carlos Martínez</p>
            <p style={{ fontSize: '12px', color: 'var(--gray-500)', display: 'flex', alignItems: 'center', gap: '4px', marginTop: '2px' }}><IconPhone /> 9999-1234</p>
          </div>

          {/* Plan selection */}
          <div style={{ marginBottom: '20px' }}>
            <label style={{ display: 'block', fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--gray-400)', marginBottom: '10px' }}>Plan</label>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
              <button
                id="plan-quincena"
                onClick={() => setPlan('quincena')}
                className={`plan-btn btn-press ${plan === 'quincena' ? 'active' : 'inactive'}`}
              >
                <span style={{ display: 'block', fontSize: '11px', opacity: 0.7, marginBottom: '2px' }}>15 días</span>
                Quincena
                <span style={{ display: 'block', fontSize: '12px', marginTop: '4px', fontWeight: 700 }}>Lps. 400</span>
              </button>
              <button
                id="plan-mes"
                onClick={() => setPlan('mes')}
                className={`plan-btn btn-press ${plan === 'mes' ? 'active' : 'inactive'}`}
              >
                <span style={{ display: 'block', fontSize: '11px', opacity: 0.7, marginBottom: '2px' }}>30 días</span>
                Mes Completo
                <span style={{ display: 'block', fontSize: '12px', marginTop: '4px', fontWeight: 700 }}>Lps. 700</span>
              </button>
            </div>
          </div>

          {/* Discounts */}
          <div style={{ marginBottom: '20px' }}>
            <label style={{ display: 'block', fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--gray-400)', marginBottom: '10px' }}>Descuentos</label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              <button
                id="discount-student"
                onClick={() => toggleDiscount('student')}
                className={`discount-row ${discounts.student ? 'active' : ''}`}
              >
                <div className={`check-box ${discounts.student ? 'checked' : ''}`}>
                  {discounts.student && <IconCheck />}
                </div>

                id="discount-senior"
                onClick={() => toggleDiscount('senior')}
                className={`discount-row ${discounts.senior ? 'active' : ''}`}
              >
                <div className={`check-box ${discounts.senior ? 'checked' : ''}`}>
                  {discounts.senior && <IconCheck />}
                </div>
                <span>👴 Tercera Edad</span>
                <span style={{ marginLeft: 'auto', fontSize: '12px', fontWeight: 600, color: 'var(--gray-400)' }}>-20%</span>
              </button>
            </div>
          </div>

          {/* Payment method */}
          <div style={{ marginBottom: '24px' }}>
            <label style={{ display: 'block', fontSize: '12px', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--gray-400)', marginBottom: '10px' }}>Método de Pago</label>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
              <button
                id="pay-efectivo"
                onClick={() => setPayMethod('efectivo')}
                className={`method-btn btn-press ${payMethod === 'efectivo' ? 'active' : 'inactive'}`}
              >
                <IconCash />
                Efectivo
              </button>
              <button
                id="pay-transferencia"
                onClick={() => setPayMethod('transferencia')}
                className={`method-btn btn-press ${payMethod === 'transferencia' ? 'active' : 'inactive'}`}
              >
                <IconTransfer />
                Transferencia
              </button>
            </div>
          </div>

          {/* Total */}
          <div style={{ padding: '16px', borderRadius: '12px', background: 'var(--gray-50)', border: '1px solid var(--gray-200)', marginBottom: '20px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
              <span style={{ fontSize: '13px', color: 'var(--gray-500)' }}>Subtotal</span>
              <span style={{ fontSize: '14px', color: 'var(--gray-700)' }}>Lps. {basePrice.toFixed(2)}</span>
            </div>
            {discount > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                <span style={{ fontSize: '13px', color: 'var(--success)' }}>Descuento</span>
                <span style={{ fontSize: '14px', color: 'var(--success)' }}>-Lps. {(basePrice * discount).toFixed(2)}</span>
              </div>
            )}
            <div style={{ borderTop: '1px solid var(--gray-200)', marginTop: '8px', paddingTop: '8px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: '14px', fontWeight: 700, color: 'var(--gray-900)' }}>Total</span>
              <span style={{ fontSize: '22px', fontWeight: 800, color: 'var(--primary)', letterSpacing: '-0.02em' }}>Lps. {finalPrice.toFixed(2)}</span>
            </div>
          </div>

          {/* Confirm button */}
          <button
            id="btn-confirm-payment"
            onClick={handleConfirm}
            className="btn-press"
            style={{
              width: '100%',
              padding: '14px',
              borderRadius: '12px',
              fontSize: '14px',
              fontWeight: 700,
              border: 'none',
              cursor: 'pointer',
              transition: 'all 0.3s ease',
              background: showConfirm ? 'var(--success)' : 'var(--primary)',
              color: 'white',
              boxShadow: showConfirm ? '0 4px 12px rgba(16, 185, 129, 0.3)' : '0 4px 12px rgba(79, 70, 229, 0.3)',
            }}
          >
            {showConfirm ? (
              <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                <svg style={{width:20,height:20}} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                ¡Pago Registrado!
              </span>
            ) : (
              `Confirmar Pago — Lps. ${finalPrice.toFixed(2)}`
            )}
          </button>
        </div>
      );
    }
